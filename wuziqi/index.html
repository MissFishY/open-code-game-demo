<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>五子棋 · Gomoku</title>
<style>
  :root{
    --bg:#141110;
    --panel:rgba(255,255,255,.045);
    --panel-2:rgba(255,255,255,.07);
    --line:rgba(255,255,255,.10);
    --text:#f3ede3;
    --muted:#a59684;
    --gold:#e3b262;
    --gold-2:#c9954a;
    --ink:#1a1408;
    --good:#79c08b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  html{scrollbar-gutter:stable}
  body{
    margin:0;
    padding:22px;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:
      radial-gradient(1100px 720px at 12% -12%, #2b221b 0%, rgba(43,34,27,0) 62%),
      radial-gradient(900px 680px at 106% 112%, #26201a 0%, rgba(38,32,26,0) 58%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }

  .app{
    width:min(1150px,100%);
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-mark{
    width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #6f6f6f, #171717 62%, #000);
    box-shadow:0 4px 14px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.08);
    position:relative;flex:none;
  }
  .brand-mark::after{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 30% 26%, rgba(255,255,255,.55), rgba(255,255,255,0) 45%);
  }
  h1{margin:0;font-size:19px;letter-spacing:.14em;font-weight:600}
  h1 small{display:block;font-size:10px;letter-spacing:.34em;color:var(--muted);font-weight:400;margin-top:3px}
  .rules{
    font-size:12px;color:var(--muted);letter-spacing:.04em;
    border:1px solid var(--line);border-radius:999px;padding:7px 14px;
    background:var(--panel);
  }

  .layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 268px;
    gap:20px;
    align-items:start;
  }

  /* ---------- board ---------- */
  .board-wrap{
    position:relative;
    width:min(100%, 74vh, 700px);
    aspect-ratio:1/1;
    margin-inline:auto;
    border-radius:20px;
    box-shadow:
      0 30px 60px -18px rgba(0,0,0,.75),
      0 0 0 1px rgba(255,255,255,.06),
      inset 0 0 0 1px rgba(255,255,255,.05);
    overflow:hidden;
    isolation:isolate;
  }
  canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:manipulation}

  .overlay{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%, rgba(12,9,6,.62), rgba(12,9,6,.86));
    backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;
    transition:opacity .28s ease;
    z-index:5;
  }
  .overlay.show{opacity:1;pointer-events:auto}
  .overlay-card{
    text-align:center;
    padding:26px 34px;
    border-radius:18px;
    background:linear-gradient(180deg, rgba(46,38,29,.96), rgba(28,23,18,.98));
    border:1px solid rgba(227,178,98,.28);
    box-shadow:0 24px 60px rgba(0,0,0,.6);
    transform:translateY(10px) scale(.97);
    transition:transform .3s cubic-bezier(.2,.9,.3,1.2);
  }
  .overlay.show .overlay-card{transform:translateY(0) scale(1)}
  .overlay-title{font-size:22px;letter-spacing:.16em;font-weight:600;color:var(--gold)}
  .overlay-sub{font-size:12px;color:var(--muted);margin-top:7px;letter-spacing:.08em}
  .overlay .btn{margin-top:18px}

  /* ---------- panel ---------- */
  .panel{display:flex;flex-direction:column;gap:14px}

  .status{
    display:flex;align-items:center;gap:13px;
    padding:15px 16px;
    border-radius:16px;
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
  }
  .turn-stone{
    width:30px;height:30px;border-radius:50%;flex:none;position:relative;
    transition:background .25s ease, box-shadow .25s ease;
  }
  .turn-stone.black{
    background:radial-gradient(circle at 32% 28%, #747474, #1b1b1b 58%, #000);
    box-shadow:0 3px 10px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.09);
  }
  .turn-stone.white{
    background:radial-gradient(circle at 32% 28%, #fff, #f0ece4 52%, #c9c2b4);
    box-shadow:0 3px 10px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.7);
  }
  .turn-stone.thinking{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.86);opacity:.55}}

  .status-title{font-size:14px;font-weight:600;letter-spacing:.06em}
  .status-sub{font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.04em}

  .group{display:flex;flex-direction:column;gap:7px}
  .group-label{font-size:10.5px;letter-spacing:.22em;color:var(--muted);padding-left:3px}

  .seg{
    display:flex;gap:4px;padding:4px;
    border-radius:13px;background:rgba(0,0,0,.28);
    border:1px solid var(--line);
  }
  .seg button{
    flex:1;appearance:none;border:0;background:transparent;
    color:var(--muted);font:inherit;font-size:12.5px;
    padding:8px 4px;border-radius:9px;cursor:pointer;
    transition:all .18s ease;letter-spacing:.03em;
  }
  .seg button:hover{color:var(--text)}
  .seg button.active{
    background:linear-gradient(180deg, rgba(227,178,98,.24), rgba(227,178,98,.12));
    color:var(--gold);
    box-shadow:inset 0 0 0 1px rgba(227,178,98,.3);
  }

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:2px}
  .btn{
    appearance:none;font:inherit;font-size:13px;letter-spacing:.04em;
    padding:11px 12px;border-radius:12px;cursor:pointer;
    color:var(--text);
    background:linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.03));
    border:1px solid var(--line);
    transition:transform .14s ease, background .18s ease, box-shadow .18s ease, opacity .18s;
  }
  .btn:hover{background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.05))}
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn:disabled{opacity:.36;cursor:not-allowed;transform:none}
  .btn.primary{
    grid-column:1 / -1;
    color:var(--ink);font-weight:600;border-color:transparent;
    background:linear-gradient(180deg, #f0c67e, #d8a655);
    box-shadow:0 8px 22px -8px rgba(227,178,98,.6);
  }
  .btn.primary:hover{background:linear-gradient(180deg,#f6cf8b,#dfae5c)}
  .btn.ghost{grid-column:1 / -1;font-size:12px;padding:9px;color:var(--muted)}

  .meta{
    display:flex;justify-content:space-between;align-items:center;
    font-size:11.5px;color:var(--muted);letter-spacing:.1em;
    padding:11px 15px;border-radius:12px;
    border:1px dashed rgba(255,255,255,.09);
  }
  .meta b{color:var(--text);font-weight:600}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
    background:rgba(30,24,18,.96);border:1px solid rgba(227,178,98,.3);
    color:var(--gold);font-size:12.5px;letter-spacing:.06em;
    padding:10px 18px;border-radius:999px;
    opacity:0;pointer-events:none;transition:all .25s ease;z-index:50;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:820px){
    body{padding:14px}
    .layout{grid-template-columns:1fr;gap:16px}
    .board-wrap{width:min(100%, 92vw)}
    .panel{order:2}
    .actions{grid-template-columns:1fr 1fr}
    .rules{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="brand-mark"></div>
      <h1>五子棋<small>G O M O K U</small></h1>
    </div>
    <div class="rules">15 × 15 · 先连成五子者胜</div>
  </header>

  <div class="layout">
    <div class="board-wrap">
      <canvas id="board"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <div class="overlay-title" id="ovTitle">黑棋胜</div>
          <div class="overlay-sub" id="ovSub">共 0 手</div>
          <button class="btn primary" id="ovBtn" style="width:100%">再来一局</button>
        </div>
      </div>
    </div>

    <aside class="panel">
      <div class="status">
        <div class="turn-stone black" id="turnStone"></div>
        <div>
          <div class="status-title" id="statusTitle">黑棋回合</div>
          <div class="status-sub" id="statusSub">你先手 · 点击棋盘落子</div>
        </div>
      </div>

      <div class="group">
        <div class="group-label">对局模式</div>
        <div class="seg" id="modeSeg">
          <button data-mode="pve" class="active">人机对战</button>
          <button data-mode="pvp">双人对战</button>
        </div>
      </div>

      <div class="group" id="diffGroup">
        <div class="group-label">AI 难度</div>
        <div class="seg" id="diffSeg">
          <button data-diff="easy">简单</button>
          <button data-diff="medium" class="active">普通</button>
          <button data-diff="hard">困难</button>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="undoBtn">悔棋</button>
        <button class="btn" id="hintBtn">提示</button>
        <button class="btn primary" id="newBtn">重新开始</button>
        <button class="btn ghost" id="soundBtn">音效：开</button>
      </div>

      <div class="meta">
        <span>第 <b id="moveCount">0</b> 手</span>
        <span id="modeBadge">人机 · 普通</span>
      </div>
    </aside>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  const SIZE = 15;
  const EMPTY = 0, BLACK = 1, WHITE = 2;
  const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
  const TAU = Math.PI * 2;

  /* ---------------- state ---------------- */
  const board = Array.from({ length: SIZE }, () => new Array(SIZE).fill(EMPTY));
  let history = [];
  let current = BLACK;
  let gameOver = false;
  let winner = 0;              // 0 = none, 1 = black, 2 = white, -1 = draw
  let winLine = null;
  let lastMove = null;
  let hover = null;
  let hintCell = null;
  let thinking = false;
  let aiToken = 0;
  let overlayTimer = null;
  let winAnimUntil = 0;
  let hintAnimUntil = 0;

  let mode = "pve";            // pve | pvp
  let difficulty = "medium";   // easy | medium | hard
  const HUMAN = BLACK, AI = WHITE;

  let soundOn = true;

  /* ---------------- canvas ---------------- */
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  let px = 600, pad = 30, cell = 40;
  let bgCache = null, bgSize = 0;
  const anims = new Map();     // cellIndex -> startTime
  let raf = null;

  function fit() {
    const wrap = canvas.parentElement;
    const rect = wrap.getBoundingClientRect();
    const size = Math.max(220, Math.floor(Math.min(rect.width, rect.height) || 600));
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const bw = Math.round(size * dpr);
    if (canvas.width !== bw) { canvas.width = bw; canvas.height = bw; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    px = size;
    pad = size * 0.052;
    cell = (size - pad * 2) / (SIZE - 1);
    draw();
  }

  function gx(i) { return pad + i * cell; }

  function schedule() {
    if (raf) return;
    raf = requestAnimationFrame((t) => { raf = null; draw(t); });
  }

  /* ---------------- board background ---------------- */
  function ensureBg(size) {
    if (bgCache && bgSize === size) return bgCache;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const c = document.createElement("canvas");
    c.width = Math.round(size * dpr);
    c.height = Math.round(size * dpr);
    const g = c.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);

    const lg = g.createLinearGradient(0, 0, size, size);
    lg.addColorStop(0, "#eecf9c");
    lg.addColorStop(0.42, "#e3bd85");
    lg.addColorStop(1, "#cea265");
    g.fillStyle = lg;
    g.fillRect(0, 0, size, size);

    // wood grain
    g.save();
    g.globalAlpha = 0.055;
    g.strokeStyle = "#7a5326";
    for (let i = 0; i < 44; i++) {
      const y = ((i + 0.5) / 44) * size + Math.sin(i * 1.7) * size * 0.005;
      g.lineWidth = 0.5 + (i % 3) * 0.4;
      g.beginPath();
      g.moveTo(0, y);
      for (let x = 0; x <= size; x += size / 14) {
        g.lineTo(x, y + Math.sin(i * 2.1 + (x / size) * 7) * size * 0.0035);
      }
      g.stroke();
    }
    g.restore();

    // vignette
    const rg = g.createRadialGradient(size * 0.5, size * 0.4, size * 0.16, size * 0.5, size * 0.52, size * 0.8);
    rg.addColorStop(0, "rgba(255,242,214,.34)");
    rg.addColorStop(1, "rgba(118,76,28,.20)");
    g.fillStyle = rg;
    g.fillRect(0, 0, size, size);

    bgCache = c; bgSize = size;
    return c;
  }

  /* ---------------- drawing ---------------- */
  const STARS = [[3, 3], [3, 11], [11, 3], [11, 11], [7, 7]];

  function draw(t = performance.now()) {
    const s = px;
    ctx.clearRect(0, 0, s, s);
    ctx.drawImage(ensureBg(s), 0, 0, s, s);

    // grid
    ctx.strokeStyle = "rgba(78,50,20,.55)";
    ctx.lineWidth = Math.max(0.8, s * 0.0015);
    ctx.beginPath();
    for (let i = 0; i < SIZE; i++) {
      ctx.moveTo(gx(0), gx(i)); ctx.lineTo(gx(SIZE - 1), gx(i));
      ctx.moveTo(gx(i), gx(0)); ctx.lineTo(gx(i), gx(SIZE - 1));
    }
    ctx.stroke();

    // outer border
    ctx.strokeStyle = "rgba(62,38,13,.8)";
    ctx.lineWidth = Math.max(1.4, s * 0.0028);
    ctx.strokeRect(gx(0), gx(0), gx(SIZE - 1) - gx(0), gx(SIZE - 1) - gx(0));

    // star points
    ctx.fillStyle = "rgba(58,36,14,.78)";
    for (const [r, c] of STARS) {
      ctx.beginPath();
      ctx.arc(gx(c), gx(r), Math.max(1.6, cell * 0.085), 0, TAU);
      ctx.fill();
    }

    // hover ghost
    if (hover && !gameOver && !thinking && !winLine && board[hover.r][hover.c] === EMPTY && canHumanPlay()) {
      drawStone(hover.r, hover.c, current, 0.30, 1);
    }

    // stones
    let animating = false;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = board[r][c];
        if (!v) continue;
        let scale = 1;
        const key = r * SIZE + c;
        const started = anims.get(key);
        if (started !== undefined) {
          const p = (t - started) / 150;
          if (p < 1) { scale = 0.5 + 0.5 * easeOut(p); animating = true; }
          else anims.delete(key);
        }
        drawStone(r, c, v, 1, scale);
      }
    }

    // last move marker
    if (lastMove && !winLine) {
      const { r, c } = lastMove;
      ctx.beginPath();
      ctx.arc(gx(c), gx(r), Math.max(2, cell * 0.105), 0, TAU);
      ctx.fillStyle = board[r][c] === BLACK ? "rgba(245,232,206,.9)" : "rgba(60,44,24,.82)";
      ctx.fill();
    }

    // hint ring
    if (hintCell) {
      const pulse = 0.5 + 0.5 * Math.sin(t / 300);
      ctx.save();
      ctx.strokeStyle = `rgba(227,178,98,${0.45 + 0.4 * pulse})`;
      ctx.lineWidth = Math.max(1.6, cell * 0.07);
      ctx.beginPath();
      ctx.arc(gx(hintCell.c), gx(hintCell.r), cell * 0.44, 0, TAU);
      ctx.stroke();
      ctx.restore();
      if (t < hintAnimUntil) schedule();
    }

    // winning line
    if (winLine) {
      const a = winLine[0], b = winLine[winLine.length - 1];
      const pulse = 0.5 + 0.5 * Math.sin(t / 340);
      ctx.save();
      ctx.lineCap = "round";
      ctx.strokeStyle = `rgba(255,198,96,${0.42 + 0.42 * pulse})`;
      ctx.lineWidth = cell * 0.13;
      ctx.shadowColor = "rgba(255,190,80,.95)";
      ctx.shadowBlur = cell * 0.6;
      ctx.beginPath();
      ctx.moveTo(gx(a.c), gx(a.r));
      ctx.lineTo(gx(b.c), gx(b.r));
      ctx.stroke();
      ctx.restore();
      if (t < winAnimUntil) schedule();
    }

    if (animating) schedule();
  }

  function easeOut(p) { return 1 - Math.pow(1 - p, 3); }

  function drawStone(r, c, color, alpha, scale) {
    const x = gx(c), y = gx(r);
    const rad = cell * 0.425 * scale;
    if (rad <= 0.2) return;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = color === BLACK ? "rgba(0,0,0,.5)" : "rgba(70,48,24,.38)";
    ctx.shadowBlur = cell * 0.16;
    ctx.shadowOffsetY = cell * 0.055;

    const g = ctx.createRadialGradient(
      x - rad * 0.34, y - rad * 0.4, rad * 0.08,
      x, y, rad * 1.02
    );
    if (color === BLACK) {
      g.addColorStop(0, "#7e7e7e");
      g.addColorStop(0.32, "#2e2e2e");
      g.addColorStop(0.78, "#101010");
      g.addColorStop(1, "#050505");
    } else {
      g.addColorStop(0, "#ffffff");
      g.addColorStop(0.5, "#f5f2eb");
      g.addColorStop(0.86, "#ddd7ca");
      g.addColorStop(1, "#c6bfb0");
    }
    ctx.beginPath();
    ctx.arc(x, y, rad, 0, TAU);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();

    // rim light
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(x, y, rad, 0, TAU);
    ctx.lineWidth = Math.max(0.7, rad * 0.055);
    ctx.strokeStyle = color === BLACK ? "rgba(255,255,255,.11)" : "rgba(120,100,70,.26)";
    ctx.stroke();
    ctx.restore();
  }

  /* ---------------- rules ---------------- */
  function at(r, c) {
    return (r < 0 || r >= SIZE || c < 0 || c >= SIZE) ? 3 : board[r][c];
  }

  function findWin(r, c, p) {
    for (const [dr, dc] of DIRS) {
      const line = [{ r, c }];
      for (const sign of [1, -1]) {
        let i = 1;
        while (true) {
          const nr = r + dr * i * sign, nc = c + dc * i * sign;
          if (at(nr, nc) !== p) break;
          line.push({ r: nr, c: nc });
          i++;
        }
      }
      if (line.length >= 5) {
        line.sort((a, b) => (a.r - b.r) || (a.c - b.c));
        return line;
      }
    }
    return null;
  }

  function canHumanPlay() {
    if (gameOver || thinking) return false;
    if (mode === "pve" && current === AI) return false;
    return true;
  }

  /* ---------------- game flow ---------------- */
  function play(r, c, p, silent) {
    board[r][c] = p;
    history.push({ r, c, p });
    lastMove = { r, c };
    hintCell = null;
    anims.set(r * SIZE + c, performance.now());

    if (!silent) sound("place");

    const line = findWin(r, c, p);
    if (line) {
      gameOver = true;
      winner = p;
      winLine = line;
      winAnimUntil = performance.now() + 8000;
      sound("win");
      updateUI();
      schedule();
      clearTimeout(overlayTimer);
      overlayTimer = setTimeout(() => showOverlay(p, line), 820);
      return;
    }
    if (history.length === SIZE * SIZE) {
      gameOver = true;
      winner = -1;
      updateUI();
      schedule();
      clearTimeout(overlayTimer);
      overlayTimer = setTimeout(() => showOverlay(-1, null), 300);
      return;
    }
    current = p === BLACK ? WHITE : BLACK;
    updateUI();
    schedule();

    if (mode === "pve" && current === AI && !gameOver) aiTurn();
  }

  function tryPlay(r, c) {
    if (!canHumanPlay()) return;
    if (board[r][c] !== EMPTY) return;
    play(r, c, current);
  }

  function aiTurn() {
    const token = ++aiToken;
    thinking = true;
    updateUI();
    schedule();

    setTimeout(() => {
      if (token !== aiToken || gameOver) return;
      const mv = chooseMove(AI, difficulty);
      thinking = false;
      if (!mv) { updateUI(); return; }
      play(mv.r, mv.c, AI);
    }, 300 + Math.random() * 180);
  }

  function reset() {
    aiToken++;
    clearTimeout(overlayTimer);
    for (const row of board) row.fill(EMPTY);
    history = [];
    current = BLACK;
    gameOver = false;
    winner = 0;
    winLine = null;
    winAnimUntil = 0;
    hintAnimUntil = 0;
    lastMove = null;
    hover = null;
    hintCell = null;
    thinking = false;
    anims.clear();
    hideOverlay();
    updateUI();
    schedule();
  }

  function undo() {
    if (thinking || !history.length) return;
    aiToken++;
    clearTimeout(overlayTimer);
    hideOverlay();
    gameOver = false;
    winner = 0;
    winLine = null;
    winAnimUntil = 0;
    hintCell = null;

    const pop = () => {
      const m = history.pop();
      if (m) board[m.r][m.c] = EMPTY;
    };

    if (mode === "pve") {
      if (history[history.length - 1].p === AI) pop();
      if (history.length) pop();
    } else {
      pop();
    }

    lastMove = history.length ? { r: history[history.length - 1].r, c: history[history.length - 1].c } : null;
    current = history.length ? (history[history.length - 1].p === BLACK ? WHITE : BLACK) : BLACK;

    // 人机模式下若轮到 AI（理论上不会），直接让 AI 走
    updateUI();
    schedule();
  }

  function hint() {
    if (gameOver || thinking) return;
    if (mode === "pve" && current !== HUMAN) return;
    const mv = chooseMove(current, "hard");
    if (!mv) return;
    hintCell = { r: mv.r, c: mv.c };
    hintAnimUntil = performance.now() + 5000;
    toast("推荐落点已标出");
    sound("hint");
    schedule();
  }

  /* ---------------- AI ---------------- */
  const SHAPES = [
    [/11111/g, 1000000],                                    // 五连
    [/011110/g, 100000],                                    // 活四
    [/11110|01111|11011|10111|11101/g, 15000],              // 冲四 / 跳四
    [/001110|011100/g, 8000],                               // 活三
    [/01110/g, 1000],                                       // 眠三
    [/0110/g, 500],                                         // 活二（连二）
    [/01010|010010/g, 220],                                 // 跳二
    [/00101|10100/g, 110],                                  // 小跳二
    [/00011|11000|10010|01001|10001/g, 40]                  // 眠二
  ];

  const scratch = new Uint8Array(11);

  function evalLine(str) {
    let score = 0;
    scratch.fill(0);
    for (let k = 0; k < SHAPES.length; k++) {
      const re = SHAPES[k][0], val = SHAPES[k][1];
      re.lastIndex = 0;
      let m;
      while ((m = re.exec(str)) !== null) {
        const start = m.index, end = start + m[0].length;
        let clash = false;
        for (let i = start; i < end; i++) if (scratch[i]) { clash = true; break; }
        if (!clash) {
          for (let i = start; i < end; i++) scratch[i] = 1;
          score += val;
          if (val === 1000000) return score;
        }
        re.lastIndex = start + 1;
      }
    }
    return score;
  }

  function scoreAt(r, c, p) {
    board[r][c] = p;
    let total = 0;
    for (let d = 0; d < 4; d++) {
      const dr = DIRS[d][0], dc = DIRS[d][1];
      let s = "x";
      for (let k = -4; k <= 4; k++) {
        const v = at(r + dr * k, c + dc * k);
        s += v === p ? "1" : v === 0 ? "0" : "x";
      }
      s += "x";
      total += evalLine(s);
    }
    board[r][c] = EMPTY;
    return total;
  }

  function makesWin(r, c, p) {
    board[r][c] = p;
    const win = !!findWin(r, c, p);
    board[r][c] = EMPTY;
    return win;
  }

  function candidates() {
    const out = [];
    const seen = new Set();
    let any = false;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!board[r][c]) continue;
        any = true;
        for (let dr = -2; dr <= 2; dr++) {
          for (let dc = -2; dc <= 2; dc++) {
            if (!dr && !dc) continue;
            const nr = r + dr, nc = c + dc;
            if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) continue;
            if (board[nr][nc]) continue;
            const k = nr * SIZE + nc;
            if (seen.has(k)) continue;
            seen.add(k);
            out.push({ r: nr, c: nc });
          }
        }
      }
    }
    if (!any) out.push({ r: 7, c: 7 });
    return out;
  }

  function centerBias(r, c) {
    return (SIZE - Math.abs(r - 7) - Math.abs(c - 7)) * 2;
  }

  // 邻近已有棋子略微加分，避免开局走出“飘”的棋
  function adjBonus(r, c) {
    let n = 0;
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const v = at(r + dr, c + dc);
        if (v === BLACK || v === WHITE) n++;
      }
    }
    return n * 25;
  }

  function chooseMove(me, level) {
    const opp = me === BLACK ? WHITE : BLACK;
    const cands = candidates();
    if (!cands.length) return null;
    if (cands.length === 1) return cands[0];

    // 1. 自己能一步成五
    const myWin = cands.filter((m) => makesWin(m.r, m.c, me));
    if (myWin.length) return myWin[Math.floor(Math.random() * myWin.length)];

    // 2. 阻止对手一步成五
    const blocks = cands.filter((m) => makesWin(m.r, m.c, opp));
    if (blocks.length && (level !== "easy" || Math.random() < 0.75)) {
      let best = blocks[0], bv = -Infinity;
      for (const m of blocks) {
        const v = scoreAt(m.r, m.c, me) + adjBonus(m.r, m.c) + centerBias(m.r, m.c);
        if (v > bv) { bv = v; best = m; }
      }
      return best;
    }

    // 3. 常规评估：进攻分 + 防守分
    const defW = level === "hard" ? 0.95 : 0.85;
    const scored = cands.map((m) => {
      const mine = scoreAt(m.r, m.c, me);
      const theirs = scoreAt(m.r, m.c, opp);
      let v = mine + theirs * defW + adjBonus(m.r, m.c) + centerBias(m.r, m.c);
      if (level === "easy") v += (Math.random() - 0.5) * 8000;
      return { r: m.r, c: m.c, v };
    });
    scored.sort((a, b) => b.v - a.v);

    if (level === "easy") {
      const top = scored.slice(0, Math.min(5, scored.length));
      return top[Math.floor(Math.random() * top.length)];
    }
    if (level === "medium") return scored[0];

    // 4. 困难：在接近最高分的候选中，挑一个让对手后续威胁最小的
    const topVal = scored[0].v;
    const thr = topVal > 0 ? topVal * 0.85 : topVal;
    const pool = scored.filter((s) => s.v >= thr).slice(0, 5);
    if (pool.length <= 1) return scored[0];

    let best = pool[0], bestVal = -Infinity;
    for (const mv of pool) {
      board[mv.r][mv.c] = me;
      let oppBest = 0;
      for (const o of candidates()) {
        const s = scoreAt(o.r, o.c, opp);
        if (s > oppBest) oppBest = s;
        if (oppBest >= 1000000) break;
      }
      board[mv.r][mv.c] = EMPTY;
      const val = mv.v - oppBest * 0.5;
      if (val > bestVal) { bestVal = val; best = mv; }
    }
    return best;
  }

  /* ---------------- UI ---------------- */
  const el = (id) => document.getElementById(id);
  const turnStone = el("turnStone");
  const statusTitle = el("statusTitle");
  const statusSub = el("statusSub");
  const moveCount = el("moveCount");
  const modeBadge = el("modeBadge");
  const diffGroup = el("diffGroup");
  const undoBtn = el("undoBtn");
  const hintBtn = el("hintBtn");
  const overlay = el("overlay");

  const DIFF_NAME = { easy: "简单", medium: "普通", hard: "困难" };

  function updateUI() {
    moveCount.textContent = history.length;
    undoBtn.disabled = thinking || !history.length;
    hintBtn.disabled = gameOver || thinking || (mode === "pve" && current !== HUMAN);
    diffGroup.style.display = mode === "pve" ? "" : "none";
    modeBadge.textContent = mode === "pve" ? `人机 · ${DIFF_NAME[difficulty]}` : "双人对战";

    if (gameOver) {
      if (winner === -1) {
        statusTitle.textContent = "平局";
        statusSub.textContent = "棋盘已满";
        turnStone.className = "turn-stone black";
      } else {
        const who = mode === "pve"
          ? (winner === HUMAN ? "你赢了" : "AI 获胜")
          : (winner === BLACK ? "黑棋胜" : "白棋胜");
        statusTitle.textContent = who;
        statusSub.textContent = `共 ${history.length} 手`;
        turnStone.className = "turn-stone " + (winner === BLACK ? "black" : "white");
      }
      return;
    }

    if (thinking) {
      statusTitle.textContent = "AI 思考中";
      statusSub.textContent = "稍等一下…";
      turnStone.className = "turn-stone " + (current === BLACK ? "black" : "white") + " thinking";
      return;
    }

    const colorName = current === BLACK ? "黑棋" : "白棋";
    if (mode === "pve") {
      statusTitle.textContent = current === HUMAN ? "你的回合" : "AI 回合";
      statusSub.textContent = `${colorName} · 点击棋盘落子`;
    } else {
      statusTitle.textContent = `${colorName}回合`;
      statusSub.textContent = "轮流落子 · 先五连者胜";
    }
    turnStone.className = "turn-stone " + (current === BLACK ? "black" : "white");
  }

  function showOverlay(win, line) {
    let title;
    if (win === -1) title = "平局";
    else if (mode === "pve") title = win === HUMAN ? "你赢了" : "AI 获胜";
    else title = win === BLACK ? "黑棋胜" : "白棋胜";
    el("ovTitle").textContent = title;
    el("ovSub").textContent = line ? `共 ${history.length} 手 · 五子连珠` : `共 ${history.length} 手`;
    overlay.classList.add("show");
  }

  function hideOverlay() { overlay.classList.remove("show"); }

  let toastTimer = null;
  function toast(msg) {
    const t = el("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
  }

  /* ---------------- sound ---------------- */
  let actx = null;
  function sound(kind) {
    if (!soundOn) return;
    try {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
      }
      if (actx.state === "suspended") actx.resume();
      const now = actx.currentTime;

      if (kind === "place") {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = "triangle";
        o.frequency.setValueAtTime(460, now);
        o.frequency.exponentialRampToValueAtTime(170, now + 0.07);
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.14, now + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
        o.connect(g).connect(actx.destination);
        o.start(now); o.stop(now + 0.12);
      } else if (kind === "hint") {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = "sine"; o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.05, now + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
        o.connect(g).connect(actx.destination);
        o.start(now); o.stop(now + 0.18);
      } else if (kind === "win") {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
          const o = actx.createOscillator(), g = actx.createGain();
          o.type = "sine"; o.frequency.value = f;
          const t0 = now + i * 0.1;
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(0.1, t0 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.42);
          o.connect(g).connect(actx.destination);
          o.start(t0); o.stop(t0 + 0.45);
        });
      }
    } catch (_) { /* ignore */ }
  }

  /* ---------------- input ---------------- */
  function cellFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width) return null;
    const scale = px / rect.width;
    const x = (e.clientX - rect.left) * scale;
    const y = (e.clientY - rect.top) * scale;
    const c = Math.round((x - pad) / cell);
    const r = Math.round((y - pad) / cell);
    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return null;
    // 距离过远则忽略（避免误触）
    const dx = x - gx(c), dy = y - gx(r);
    if (Math.hypot(dx, dy) > cell * 0.62) return null;
    return { r, c };
  }

  canvas.addEventListener("click", (e) => {
    const p = cellFromEvent(e);
    if (p) tryPlay(p.r, p.c);
  });

  canvas.addEventListener("mousemove", (e) => {
    if (e.pointerType === "touch") return;
    const p = cellFromEvent(e);
    const changed = (!p && hover) || (p && (!hover || hover.r !== p.r || hover.c !== p.c));
    hover = p && !gameOver && board[p.r][p.c] === EMPTY ? p : null;
    if (changed) schedule();
  });

  canvas.addEventListener("mouseleave", () => {
    if (hover) { hover = null; schedule(); }
  });

  el("newBtn").addEventListener("click", () => { reset(); toast("新对局"); });
  el("ovBtn").addEventListener("click", () => { reset(); });
  undoBtn.addEventListener("click", undo);
  hintBtn.addEventListener("click", hint);
  el("soundBtn").addEventListener("click", (e) => {
    soundOn = !soundOn;
    e.currentTarget.textContent = "音效：" + (soundOn ? "开" : "关");
    if (soundOn) sound("hint");
  });

  el("modeSeg").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-mode]");
    if (!btn) return;
    mode = btn.dataset.mode;
    [...el("modeSeg").children].forEach((b) => b.classList.toggle("active", b === btn));
    reset();
  });

  el("diffSeg").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-diff]");
    if (!btn) return;
    difficulty = btn.dataset.diff;
    [...el("diffSeg").children].forEach((b) => b.classList.toggle("active", b === btn));
    updateUI();
  });

  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    const k = e.key.toLowerCase();
    if (k === "r") { reset(); toast("新对局"); }
    else if (k === "u") undo();
    else if (k === "h") hint();
  });

  /* ---------------- boot ---------------- */
  if (window.ResizeObserver) {
    new ResizeObserver(() => fit()).observe(canvas.parentElement);
  } else {
    window.addEventListener("resize", fit);
  }
  window.addEventListener("orientationchange", () => setTimeout(fit, 120));

  fit();
  updateUI();

  // 首帧绘制（等布局稳定后再校准一次）
  requestAnimationFrame(() => { fit(); });

  // 只读状态快照（便于排查问题，不影响对局）
  window.__gomoku = {
    snapshot: () => ({
      board: board.map((row) => row.slice()),
      current,
      gameOver,
      winner,
      lastMove,
      moves: history.length,
      mode,
      difficulty,
      thinking
    })
  };
})();
</script>
</body>
</html>
