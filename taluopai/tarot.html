<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>塔罗三牌阵 · 过去 · 现在 · 未来</title>
<style>
  :root{
    --bg-0:#07050f;
    --bg-1:#130e29;
    --gold:#d9b975;
    --gold-bright:#f2dcae;
    --gold-dim:rgba(217,185,117,.42);
    --ink:#f0e8d8;
    --muted:#9d92b4;
    --line:rgba(217,185,117,.18);
    --panel:rgba(255,255,255,.035);
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman","STSong",serif;
    --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  html{scrollbar-gutter:stable}
  body{
    margin:0;
    padding:clamp(22px,4vw,52px) clamp(14px,3vw,28px) 40px;
    color:var(--ink);
    font-family:var(--sans);
    background:
      radial-gradient(900px 620px at 18% -8%, rgba(88,56,150,.34), transparent 62%),
      radial-gradient(760px 560px at 88% 12%, rgba(150,110,58,.16), transparent 60%),
      radial-gradient(900px 700px at 50% 118%, rgba(54,38,104,.42), transparent 64%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 55%, #0a0718);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }

  .sky{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.9;
    background-image:
      radial-gradient(1.2px 1.2px at 26px 40px, rgba(255,255,255,.55), transparent 62%),
      radial-gradient(1px 1px at 122px 92px, rgba(255,255,255,.34), transparent 62%),
      radial-gradient(1.7px 1.7px at 170px 26px, rgba(217,185,117,.55), transparent 62%),
      radial-gradient(1px 1px at 62px 152px, rgba(255,255,255,.28), transparent 62%),
      radial-gradient(1.3px 1.3px at 196px 176px, rgba(255,255,255,.42), transparent 62%),
      radial-gradient(1px 1px at 96px 204px, rgba(217,185,117,.34), transparent 62%);
    background-size:220px 220px;
    mask-image:radial-gradient(circle at 50% 30%, #000 30%, transparent 85%);
    -webkit-mask-image:radial-gradient(circle at 50% 30%, #000 30%, transparent 85%);
  }

  main{
    position:relative; z-index:1;
    max-width:760px; margin:0 auto;
    display:flex; flex-direction:column; gap:clamp(18px,3vw,30px);
  }

  /* ---------- header ---------- */
  header{text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px}
  .orn{
    display:flex; align-items:center; gap:12px;
    color:var(--gold); font-size:11px; letter-spacing:.5em;
  }
  .orn::before,.orn::after{
    content:""; width:clamp(28px,7vw,64px); height:1px;
    background:linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }
  h1{
    margin:0; font-family:var(--serif); font-weight:500;
    font-size:clamp(26px,5.4vw,42px); letter-spacing:.22em;
    color:var(--gold-bright);
    text-shadow:0 0 26px rgba(217,185,117,.3);
  }
  .sub{
    margin:0; font-size:clamp(10px,2.1vw,12px); letter-spacing:.42em;
    color:var(--muted); text-transform:uppercase;
  }

  /* ---------- topics ---------- */
  .topics{display:flex; flex-direction:column; align-items:center; gap:10px}
  .topics-label{font-size:11px; letter-spacing:.32em; color:var(--muted)}
  .topic-list{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px;
    padding:5px; border-radius:999px;
    background:rgba(255,255,255,.03);
    border:1px solid var(--line);
  }
  .topic{
    appearance:none; border:0; cursor:pointer; font:inherit;
    font-size:13px; letter-spacing:.1em; color:var(--muted);
    padding:9px 17px; border-radius:999px; background:transparent;
    transition:color .2s ease, background .25s ease, box-shadow .25s ease;
  }
  .topic:hover{color:var(--ink)}
  .topic.active{
    color:#20180a;
    background:linear-gradient(180deg,#f0d9a6,#cba95f);
    box-shadow:0 6px 20px -8px rgba(217,185,117,.8);
    font-weight:600;
  }

  /* ---------- cards ---------- */
  .stage{display:flex; flex-direction:column; align-items:center; gap:clamp(18px,3.2vw,26px)}
  .cards{
    display:grid; grid-template-columns:repeat(3, minmax(0,1fr));
    gap:clamp(8px,2.2vw,22px); width:100%; max-width:660px;
  }
  .slot{display:flex; flex-direction:column; gap:9px; align-items:center; min-width:0}
  .slot-label{
    font-size:clamp(10px,1.9vw,11.5px); letter-spacing:.3em;
    color:var(--gold-dim); font-family:var(--serif);
  }

  .card{
    width:100%; aspect-ratio:2 / 3.25;
    perspective:1200px; cursor:default;
  }
  .card-inner{
    position:relative; width:100%; height:100%;
    transform-style:preserve-3d;
    transition:transform .78s cubic-bezier(.2,.85,.3,1);
  }
  .card.flipped .card-inner{transform:rotateY(180deg)}
  .card.no-anim .card-inner{transition:none}

  .card-face{
    position:absolute; inset:0; border-radius:clamp(7px,1.5vw,11px);
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    overflow:hidden;
  }

  /* back */
  .card-back{
    background:
      radial-gradient(circle at 50% 44%, rgba(217,185,117,.22), transparent 46%),
      repeating-linear-gradient(45deg, rgba(217,185,117,.10) 0 1px, transparent 1px 8px),
      repeating-linear-gradient(-45deg, rgba(217,185,117,.07) 0 1px, transparent 1px 11px),
      linear-gradient(160deg,#2a1f52,#150f2c 55%,#1f1740);
    box-shadow:
      inset 0 0 0 1px rgba(217,185,117,.45),
      inset 0 0 0 5px rgba(12,8,24,.92),
      inset 0 0 0 6px rgba(217,185,117,.22),
      0 14px 30px -14px rgba(0,0,0,.9);
  }
  .card-back::after{
    content:"✦";
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(20px,4.6vw,34px);
    color:rgba(217,185,117,.75);
    text-shadow:0 0 18px rgba(217,185,117,.45);
  }

  /* front */
  .card-front{
    transform:rotateY(180deg);
    background:linear-gradient(165deg,#fcf7ec 0%,#f2e8d5 52%,#e7d9be 100%);
    color:#2c2337;
    display:flex; flex-direction:column; align-items:center;
    padding:clamp(6px,1.6vw,13px) clamp(5px,1.3vw,11px);
    box-shadow:
      inset 0 0 0 1px rgba(150,116,60,.55),
      inset 0 0 0 4px rgba(252,247,236,.9),
      inset 0 0 0 5px rgba(190,158,98,.4),
      0 16px 34px -14px rgba(0,0,0,.85);
  }
  .card-front::before{
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 18%, rgba(255,255,255,.85), transparent 58%);
    pointer-events:none;
  }
  .corner{position:absolute; width:clamp(7px,1.6vw,11px); height:clamp(7px,1.6vw,11px); border:1px solid rgba(176,140,74,.6)}
  .corner.tl{top:clamp(4px,1vw,7px); left:clamp(4px,1vw,7px); border-right:0; border-bottom:0}
  .corner.tr{top:clamp(4px,1vw,7px); right:clamp(4px,1vw,7px); border-left:0; border-bottom:0}
  .corner.bl{bottom:clamp(4px,1vw,7px); left:clamp(4px,1vw,7px); border-right:0; border-top:0}
  .corner.br{bottom:clamp(4px,1vw,7px); right:clamp(4px,1vw,7px); border-left:0; border-top:0}

  .card-rank{
    font-family:var(--serif); font-size:clamp(11px,2.4vw,17px);
    letter-spacing:.14em; color:#8a6a33; opacity:.9;
    margin-top:clamp(2px,.6vw,5px);
  }
  .card-art{
    flex:1; width:100%; display:flex; align-items:center; justify-content:center;
    color:#5b4a7a; min-height:0;
  }
  .card-art svg{width:clamp(30px,8vw,54px); height:auto; display:block; transition:transform .4s ease}
  .card.rev .card-art svg{transform:rotate(180deg)}
  .card-meta{text-align:center; width:100%; padding-bottom:clamp(1px,.5vw,4px)}
  .card-name{
    font-family:var(--serif); font-size:clamp(12px,2.7vw,19px);
    letter-spacing:.1em; line-height:1.25;
  }
  .card-en{
    font-size:clamp(6.5px,1.4vw,9.5px); letter-spacing:.09em; text-transform:uppercase;
    color:#8b7b68; margin-top:3px; line-height:1.3;
  }
  .card-ori{
    display:inline-block; margin-top:clamp(3px,.8vw,6px);
    font-size:clamp(7.5px,1.5vw,10px); letter-spacing:.18em;
    padding:2px 7px; border-radius:999px;
    color:#6d5527; background:rgba(176,140,74,.14);
    border:1px solid rgba(176,140,74,.35);
  }
  .card-ori.rev{color:#8d4b45; background:rgba(150,72,64,.12); border-color:rgba(150,72,64,.35)}

  @keyframes shuf{
    0%{transform:translateY(0) rotate(0deg)}
    30%{transform:translateY(-12px) rotate(-3deg)}
    60%{transform:translateY(2px) rotate(2deg)}
    100%{transform:translateY(0) rotate(0deg)}
  }
  .stage.shuffling .card{animation:shuf .62s cubic-bezier(.3,.8,.4,1) 1 both}
  .stage.shuffling .slot:nth-child(2) .card{animation-delay:.08s}
  .stage.shuffling .slot:nth-child(3) .card{animation-delay:.16s}

  /* ---------- draw button ---------- */
  .draw-btn{
    appearance:none; font:inherit; cursor:pointer;
    padding:13px 40px; border-radius:999px;
    font-size:clamp(13px,2.3vw,15px); letter-spacing:.24em;
    color:#241a08; font-weight:600;
    background:linear-gradient(180deg,#f3ddaa,#cdaa60);
    border:1px solid rgba(255,240,200,.5);
    box-shadow:0 14px 34px -14px rgba(217,185,117,.85), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .16s ease, box-shadow .25s ease, filter .25s ease;
  }
  .draw-btn:hover{filter:brightness(1.05); box-shadow:0 18px 40px -14px rgba(217,185,117,.95), inset 0 1px 0 rgba(255,255,255,.55)}
  .draw-btn:active{transform:translateY(1px) scale(.99)}
  .draw-btn:disabled{opacity:.55; cursor:default; transform:none}
  .hintline{
    margin:-6px 0 0; font-size:11px; letter-spacing:.2em; color:var(--muted);
    min-height:1em; transition:opacity .3s ease;
  }

  /* ---------- reading ---------- */
  .reading{
    opacity:0; transform:translateY(14px);
    transition:opacity .6s ease, transform .6s ease;
    pointer-events:none;
    display:flex; flex-direction:column; gap:clamp(18px,3vw,26px);
  }
  .reading.show{opacity:1; transform:none; pointer-events:auto}

  .verdict{
    text-align:center;
    padding:clamp(18px,3.4vw,28px) clamp(16px,3vw,26px);
    border-radius:16px;
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    border:1px solid var(--line);
    box-shadow:0 20px 44px -30px rgba(0,0,0,.9);
  }
  .stars{
    font-size:clamp(16px,3.4vw,21px); letter-spacing:.32em;
    color:var(--gold); text-shadow:0 0 16px rgba(217,185,117,.5);
  }
  .vlabel{
    margin-top:10px; font-family:var(--serif);
    font-size:clamp(19px,4vw,26px); letter-spacing:.28em;
    color:var(--gold-bright);
  }
  .vtext{
    margin:10px auto 0; max-width:34em;
    font-size:clamp(13px,2.4vw,14.5px); line-height:1.95; color:#d8cfc0;
  }

  .sec-title{
    display:flex; align-items:center; gap:14px;
    margin:0; font-family:var(--serif); font-weight:500;
    font-size:clamp(13px,2.6vw,15px); letter-spacing:.34em; color:var(--gold);
  }
  .sec-title::before,.sec-title::after{
    content:""; flex:1; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }

  .insights{display:flex; flex-direction:column; gap:12px}
  .insight{
    padding:clamp(14px,2.6vw,19px) clamp(15px,2.8vw,22px);
    border-radius:14px;
    background:var(--panel);
    border:1px solid rgba(255,255,255,.06);
    border-left:2px solid var(--gold-dim);
  }
  .insight header{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:8px; text-align:left}
  .pos{
    font-family:var(--serif); font-size:12px; letter-spacing:.24em;
    color:var(--gold); flex:none;
  }
  .cname{font-size:13px; color:#e6ddcc; letter-spacing:.06em}
  .insight p{
    margin:0; font-size:clamp(13px,2.35vw,14.5px);
    line-height:2; color:#c9c0b2;
  }

  .advice{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:11px}
  .advice li{
    position:relative; padding-left:26px;
    font-size:clamp(13px,2.35vw,14.5px); line-height:1.9; color:#d3cab9;
  }
  .advice li::before{
    content:"✦"; position:absolute; left:4px; top:0;
    color:var(--gold); font-size:11px; line-height:2.35;
    text-shadow:0 0 10px rgba(217,185,117,.55);
  }

  .closing{
    margin:0; text-align:center; font-family:var(--serif);
    font-size:clamp(14px,2.6vw,16px); letter-spacing:.18em;
    color:var(--gold-dim); padding-top:2px;
  }

  footer{
    text-align:center; font-size:10.5px; letter-spacing:.16em;
    color:rgba(157,146,180,.6); line-height:1.9;
  }

  @media (max-width:520px){
    .topic{padding:8px 12px; font-size:12px; letter-spacing:.05em}
    .topic-list{gap:5px; border-radius:20px}
    .card-en{display:none}
    .insight header{gap:8px}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important}
  }
</style>
</head>

  <section class="reading" id="reading"></section>

  <footer>塔罗是一面照见内心的镜子 · 结果仅供娱乐与自我觉察</footer>
</main>

    return deck;

  const $ = (id) => document.getElementById(id);

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function sample(arr, n, rnd) {
    const pool = arr.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, n);
  }

  /* ================= 抽牌 ================= */
  function drawCards() {
    const pool = deck.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, 3).map((c) => ({ ...c, reversed: Math.random() < 0.5 }));
  }

  function fillCard(node, card) {
    const front = node.querySelector(".card-front");
    front.innerHTML =
      '<span class="corner tl"></span><span class="corner tr"></span>' +
      '<span class="corner bl"></span><span class="corner br"></span>' +
      '<div class="card-rank">' + card.mark + '</div>' +

        '<div class="card-en">' + card.en + '</div>' +
        '<div class="card-ori' + (card.reversed ? " rev" : "") + '">' + (card.reversed ? "逆位" : "正位") + '</div>' +
      '</div>';
    node.classList.toggle("rev", card.reversed);
    node.setAttribute("aria-label", card.name + (card.reversed ? " 逆位" : " 正位"));
  }

  function resetCards() {
    cardNodes.forEach((n) => {
      n.classList.add("no-anim");
      n.classList.remove("flipped", "rev");

    void document.body.offsetWidth;
    cardNodes.forEach((n) => n.classList.remove("no-anim"));
  }

  async function doDraw() {
    if (busy) return;
    busy = true;

    const btn = $("drawBtn");
    const hint = $("hintline");
    const reading = $("reading");
    btn.disabled = true;
    btn.textContent = "洗牌中…";
    reading.classList.remove("show");
    reading.innerHTML = "";
    hint.style.opacity = "0";

    resetCards();
    const stage = $("stage");
    stage.classList.add("shuffling");
    await sleep(660);
    stage.classList.remove("shuffling");

    const cards = drawCards();
    current = { cards, seed: hashStr(cards.map((c) => c.name + (c.reversed ? "R" : "U")).join("|") + topic) };

    for (let i = 0; i < 3; i++) {
      fillCard(cardNodes[i], cards[i]);
      await sleep(120);
      cardNodes[i].classList.add("flipped");
      await sleep(340);
    }

    renderReading();
    reading.classList.add("show");
    btn.disabled = false;
    btn.textContent = "再抽一次";
    hint.style.opacity = "1";
    hint.textContent = "牌已展开 · 也可以换个方向再看一次";
    busy = false;
  }

    if (score >= -1) return 2;

    return 0;
  }

    const rnd = mulberry32(current.seed ^ hashStr(topic));
    const pick = (arr) => arr[Math.floor(rnd() * arr.length)];

    const score = cards.reduce((s, c) => s + (c.reversed ? -c.tone : c.tone), 0);
    const lvl = levelOf(score);
    const stars = "★".repeat(lvl + 1) + "☆".repeat(4 - lvl);

    const blocks = cards.map((c, i) => {
      const pos = POSITIONS[i];
      const meaning = c.reversed ? c.rev : c.up;
      return {
        pos: pos.label,
        title: c.name + " · " + (c.rev ? "逆位" : "正位"),
        text: pick(pos.templates).replace("{m}", meaning)
      };
    });

    const tips = sample(t.advice, 2, rnd);
    tips.push(SUIT_ADVICE[cards[2].kind] || SUIT_ADVICE.major);

    const html =
      '<div class="verdict">' +
        '<div class="stars">' + stars + '</div>' +
        '<div class="vlabel">' + LV_LABEL[lvl] + '</div>' +
        '<p class="vtext">' + t.level[lvl] + '</p>' +
      '</div>' +
      '<h3 class="sec-title">牌面解读</h3>' +
      '<div class="insights">' +
        blocks.map((b) =>
          '<article class="insight">' +
            '<header><span class="pos">' + b.pos + '</span><span class="cname">' + b.title + '</span></header>' +
            '<p>' + b.text + '</p>' +
          '</article>'
        ).join("") +
      '</div>' +
      '<h3 class="sec-title">给你的建议</h3>' +
      '<ul class="advice">' + tips.map((a) => "<li>" + a + "</li>").join("") + '</ul>' +
      '<p class="closing">' + LV_CLOSING[lvl] + '</p>';

    $("reading").innerHTML = html;
  }

  /* ================= 交互 ================= */
  topicList.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-key]");
    if (!btn || busy) return;
    topic = btn.dataset.key;
    [...topicList.children].forEach((b) => b.classList.toggle("active", b === btn));
    if (current) {
      current.seed = hashStr(current.cards.map((c) => c.name + (c.reversed ? "R" : "U")).join("|") + topic);
      renderReading();
      $("reading").classList.add("show");
    }
  });

  $("drawBtn").addEventListener("click", doDraw);

  // 首次进入：先展示三张背面，点按钮开始
  resetCards();
})();
</script>
</body>
</html>
